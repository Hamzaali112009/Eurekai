# EUREKAI v5.1 — Render.com Deployment
# https://render.com/docs/deploy-flask

services:
  - type: web
    name: eurekai
    env: docker
    plan: starter  # $7/mo — upgrade to standard ($25) for better CPU
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eurekai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: eurekai-redis
          property: connectionString
      - key: STORAGE_TYPE
        value: local
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /
    disk:
      name: eurekai-data
      mountPath: /app/data
      sizeGB: 2

  - type: worker
    name: eurekai-worker
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: python -c "from workers import start_workers; start_workers()"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eurekai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: eurekai-redis
          property: connectionString
    disk:
      name: eurekai-worker-data
      mountPath: /app/data
      sizeGB: 5

databases:
  - name: eurekai-db
    plan: starter

redis:
  - name: eurekai-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
